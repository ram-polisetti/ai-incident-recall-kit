name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  sibling-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: ram-polisetti/model-governance-registry
          ref: a8a8a23310d634464da3d295691dd0c4b177dac0
          path: sibling-registry
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/integration -q
        env:
          MGREG_PATH: ${{ github.workspace }}/sibling-registry
